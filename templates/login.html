<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Register form</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --white: #fff;
            --black: #000;
            --lightBulue: #17a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .wrapper {
            position: relative;
            width: 750px;
            height: 450px;
            background: var(--white);
            border: 2px solid var(--black);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--black);
            overflow: hidden;
        }

        .wrapper .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        .wrapper .form-box.login {
            left: 0;
            padding: 0 60px 0 40px;
        }

        .form-box h2 {
            margin-bottom: 10px;
            position: relative;
            font-size: 32px;
            color: var(--black);
            text-align: center;
        }

        .form-box h2::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            background: var(--black);
        }

        .form-box .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 25px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--black);
            font-size: 16px;
            font-weight: 500;
            border: none;
            outline: none;
            border-bottom: 2px solid var(--black);
            transition: .5s;
            padding-right: 23px;
        }

        .input-box input:focus,
        .input-box input:valid {
            border-bottom-color: var(--lightBulue);
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--black);
            pointer-events: none;
            transition: 0.5s;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -5px;
            color: var(--lightBulue);
        }

        .input-box i {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            font-size: 18px;
            transition: 0.5s;
        }

        .input-box input:focus~i,
        .input-box input:valid~i {
            color: var(--lightBulue);
        }

        /* 🔔 Toast container */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 🔔 Toast box */
        .toast {
            min-width: 220px;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            animation: fadeIn 0.5s, fadeOut 0.5s 3.5s;
        }

        /* Success & error colors */
        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }


        form button {
            position: relative;
            width: 100%;
            height: 45px;
            background-color: var(--black);
            color: var(--white);
            border: none;
            outline: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: .3s;
        }

        form button:hover {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        form .linkTxt {
            font-size: 14px;
            color: var(--black);
            text-align: center;
            margin: 20px 0 10px;
        }

        .linkTxt p a {
            color: blue;
            text-decoration: none;
            font-weight: 600;
        }

        .wrapper .form-box.login .animation {
            transform: translateX(0);
            transition: 0.7s ease;
            opacity: 1;
            filter: blur(0);
            transition-delay: calc(.1s * var(--j));
        }

        .wrapper.active .form-box.login .animation {
            transform: translateX(-120%);
            opacity: 0;
            filter: blur(10px);
            transition-delay: calc(.1s * var(--i));
        }

        .wrapper .info-text {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wrapper .info-text.login {
            right: 0;
            text-align: right;
            padding: 0 40px 60px 150px;
        }

        .wrapper .info-text h2 {
            font-size: 36px;
            color: var(--white);
            line-height: 1.3;
            text-transform: uppercase;
        }

        .wrapper .info-text p {
            font-size: 16px;
            color: var(--white);
        }

        .wrapper .info-text.login .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition: 0.7s ease;
            transition-delay: calc(.1s * var(--j));
        }

        .wrapper.active .info-text.login .animation {
            transform: translateX(120px);
            opacity: 0;
            filter: blur(10px);
            transition: 0.7s ease;
            transition-delay: calc(.1s * var(--i));
        }

        .wrapper .rotate-bg {
            position: absolute;
            top: -4px;
            right: 0;
            width: 850px;
            height: 600px;
            background: #000;
            transform: rotate(10deg) skewY(40deg);
            transform-origin: bottom right;
            transition: 1.5s ease;
            transition-delay: 1.6s;
        }

        .wrapper.active .rotate-bg {
            transform: rotate(0) skewY(0);
            transition-delay: 0.5s;
        }

        .wrapper .form-box.register {
            padding: 0 40px 0 60px;
            right: 0;
        }

        .wrapper.active .form-box.register {
            pointer-events: auto;
        }

        .wrapper .form-box.register .animation {
            transform: translateX(120%);
            opacity: 0;
            filter: blur(10px);
            transition: .7s ease;
            transition-delay: calc(.1s * var(--j));
        }

        .wrapper.active .form-box.register .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition-delay: calc(.1s * var(--i));
        }

        .wrapper .info-text.register {
            left: 0;
            text-align: left;
            padding: 0 150px 60px 40px;
            pointer-events: none;
        }

        .wrapper.active .info-text.register {
            pointer-events: auto;
        }

        .wrapper .info-text.register .animation {
            transform: translateX(-120%);
            opacity: 0;
            filter: blur(10px);
            transition: .7s ease;
            transition-delay: calc(.1s * var(--j));
        }

        .wrapper.active .info-text.register .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition-delay: calc(.1s * var(--i));
        }

        .wrapper .rotate-bg2 {
            position: absolute;
            top: 100%;
            left: 250px;
            width: 850px;
            height: 700px;
            background: var(--white);
            transform: rotate(0) skewY(0);
            transform-origin: bottom left;
            transition: 1.5s ease;
            transition-delay: 0.5s;
        }

        .wrapper.active .rotate-bg2 {
            transform: rotate(-11deg) skewY(-40deg);
            transition-delay: 1.2s;
        }

        /* ✨ Loading spinner for button */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #fff;
            border-radius: 50%;
            animation: button-loading-spinner 1s ease infinite;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes button-loading-spinner {
            from {
                transform: translateY(-50%) rotate(0turn);
            }

            to {
                transform: translateY(-50%) rotate(1turn);
            }
        }


        /* ✅ Responsive stacking on smaller screens */
        @media (max-width: 767px) {
            .wrapper {
                width: 95vw;
                max-width: 400px;
                height: auto;
                min-height: auto;
                position: relative;
                overflow: hidden;
                border-radius: 10px;
                box-shadow: 0 0 10px var(--black);
                background: var(--white);
            }

            .form-box {
                position: absolute !important;
                width: 100% !important;
                top: 0;
                left: 0;
                box-sizing: border-box;
                padding: 30px 25px;
                border-radius: 10px;
                box-shadow: 0 0 10px #ccc;
                background: var(--white);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s ease;
                z-index: 1;
            }

            .form-box.active {
                opacity: 1;
                pointer-events: auto;
                position: relative !important;
            }

            /* Hide the info-text and rotating backgrounds on mobile */
            .info-text,
            .rotate-bg,
            .rotate-bg2 {
                display: none !important;
            }

            /* Input and typography adjustments */
            .form-box h2 {
                font-size: 24px;
                margin-bottom: 15px;
                text-align: center;
            }

            .input-box {
                margin: 15px 0;
            }

            form button {
                height: 45px;
                font-size: 16px;
                border-radius: 40px;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <div class="toast-container" id="toastContainer"></div>
    <div class="wrapper">
        <span class="rotate-bg"></span>
        <span class="rotate-bg2"></span>

        <div class="form-box login">
            <h2 class="title animation" style="--i:0; --j:21">Login</h2>
            <form action="#" id="loginForm">
                <div class="input-box animation" style="--i:1; --j:22">
                    <input type="text" id="loginUsername" required>
                    <label for="loginUsername">Username</label>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box animation" style="--i:2; --j:23">
                    <input type="password" id="loginPassword" required>
                    <label for="loginPassword">Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn animation" style="--i:3; --j:24">Login</button>
                <div class="linkTxt animation" style="--i:5; --j:25">
                    <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <div class="info-text login">
            <h2 class="animation" style="--i:0; --j:20">Welcome Back!</h2>
            <p class="animation" style="--i:1; --j:21">To keep connected with us please login with your personal info
            </p>
        </div>

        <div class="form-box register">
            <h2 class="title animation" style="--i:17; --j:0">Sign Up</h2>
            <form action="#" id="registerForm">
                <div class="input-box animation" style="--i:18; --j:1">
                    <input type="text" id="registerUsername" required>
                    <label for="registerUsername">Username</label>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box animation" style="--i:19; --j:2">
                    <input type="email" id="registerEmail" required>
                    <label for="registerEmail">Email</label>
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box animation" style="--i:20; --j:3">
                    <input type="password" id="registerPassword" required>
                    <label for="registerPassword">Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn animation" style="--i:21;--j:4">Sign Up</button>
                <div class="linkTxt animation" style="--i:22; --j:5">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>

        <div class="info-text register">
            <h2 class="animation" style="--i:17; --j:0;">Hello Friend!</h2>
            <p class="animation" style="--i:18; --j:1;">Enter your personal details and start journey with us</p>
        </div>
    </div>

    <script>
        const wrapper = document.querySelector('.wrapper');
        const registerLink = document.querySelector('.register-link');
        const loginLink = document.querySelector('.login-link');

        // --- Toggling between Login and Register Forms ---
        registerLink.onclick = () => {
            wrapper.classList.add('active');
        };

        loginLink.onclick = () => {
            wrapper.classList.remove('active');
        };

        // --- Form Handling with Fetch API ---
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            // --- REGISTRATION LOGIC ---
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Stop default form submission

                const username = document.getElementById('registerUsername').value.trim();
                const email = document.getElementById('registerEmail').value.trim();
                const password = document.getElementById('registerPassword').value;
                const submitBtn = registerForm.querySelector('button[type="submit"]');

                // Validation
                if (!username || !email || !password) {
                    showToast('सभी fields भरना जरूरी है!');
                    return;
                }

                // Show loading
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing Up...';

                try {
                    const response = await fetch('/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });

                    const result = await response.json();

                    // Hide loading
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';

                    if (response.ok) {
                        showToast(result.message || 'Registration successful!', 'success');
                        registerForm.reset();
                        loginLink.click(); // Switch to the login view
                    } else {
                        showToast(result.message || 'Registration failed!', 'error');
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                    showToast('Network error! Please try again.', 'error');
                }
            });

            // --- ✨ LOGIN LOGIC WITH PROPER REDIRECT ---
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Stop default form submission

                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                const submitBtn = loginForm.querySelector('button[type="submit"]');

                // Validation
                if (!username || !password) {
                    showToast('Username और password दोनों जरूरी हैं!');
                    return;
                }

                // Show loading
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();

                    // Hide loading
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';

                    if (response.ok) {
                        showToast(result.message || 'Login successful!', 'success');
                        setTimeout(() => {
                            window.location.href = '/index';
                        }, 1000)

                    } else {
                        showToast(result.message || 'Login failed!', 'error');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                    showToast('Network error! Please try again.', 'error');
                }
            });
        });

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.textContent = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 4000);
        }


        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.querySelector('.wrapper');
            const loginForm = document.querySelector('.form-box.login');
            const registerForm = document.querySelector('.form-box.register');
            const registerLink = document.querySelector('.register-link');
            const loginLink = document.querySelector('.login-link');


            function isMobile() {
                return window.innerWidth <= 767;
            }


            function showLogin() {
                registerForm.classList.remove('active');
                loginForm.classList.add('active');
                wrapper.classList.remove('active');
            }


            function showRegister() {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                wrapper.classList.add('active');
            }


            if (isMobile()) {
                showLogin();
            } else {

                loginForm.classList.remove('active');
                registerForm.classList.remove('active');
                wrapper.classList.remove('active');
            }


            registerLink.addEventListener('click', (e) => {
                e.preventDefault();
                if (isMobile()) {
                    showRegister();
                } else {
                    wrapper.classList.add('active');
                }
            });

            loginLink.addEventListener('click', (e) => {
                e.preventDefault();
                if (isMobile()) {
                    showLogin();
                } else {
                    wrapper.classList.remove('active');
                }
            });

            let lastWasMobile = isMobile();

            window.addEventListener('resize', () => {
                const nowMobile = isMobile();
                if (nowMobile !== lastWasMobile) {
                    if (nowMobile) {
                        showLogin();
                    } else {
                        loginForm.classList.remove('active');
                        registerForm.classList.remove('active');
                        wrapper.classList.remove('active');
                    }
                    lastWasMobile = nowMobile;
                }
            });

        });

    </script>
</body>

</html>
